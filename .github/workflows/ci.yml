name: Common C checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-and-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc gcc-arm-none-eabi
      - name: Build, test and compile Cortex-M4 objects
        env:
          CC: gcc
        run: python3 tools/verify.py --arm-compiler arm-none-eabi-gcc
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: build/host/verification.txt
          if-no-files-found: warn
